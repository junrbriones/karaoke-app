<!doctype html>
<html lang="en">
  <head>
    <title>That change couldn&rsquo;t be saved (422 Change rejected) &middot; JBKaraoke</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <!--
      Static fallback page, served when the app can't render its own error
      page (see ErrorsController). Self-contained on purpose: no app assets,
      so it still works when the rest of the app doesn't.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      :root {
        color-scheme: light dark;
        --bg: #fdfdfc; --fg: #1b1b18; --muted: #6b6b66; --border: #e3e3e0; --button: #1b1b18; --button-fg: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0b10; --fg: #ededec; --muted: #a1a09a; --border: #2a2a33; --button: #ededec; --button-fg: #0b0b10; }
      }
      body {
        background: var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main { max-width: 32rem; }
      .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: inherit; text-decoration: none; margin-bottom: 32px; }
      .code {
        font-size: clamp(4.5rem, 18vw, 6rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #00e5ff, #7c6bff 55%, #ff3df2);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { margin-top: 12px; font-size: 1.5rem; font-weight: 600; }
      p.message { margin-top: 8px; color: var(--muted); }
      .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .button {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 0 20px; border-radius: 8px;
        border: 1px solid var(--border); color: inherit; text-decoration: none; font-weight: 500;
      }
      .button.primary { background: var(--button); color: var(--button-fg); border-color: var(--button); }
      .button:focus-visible { outline: 3px solid #7c6bff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 32 32" width="40" height="40" aria-hidden="true">
        <defs>
          <linearGradient id="fill" x1="4" y1="2" x2="27" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#00e5ff"/><stop offset=".55" stop-color="#7c6bff"/><stop offset="1" stop-color="#ff3df2"/>
          </linearGradient>
          <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
            <path fill="#fff" d="M16 30.6C12.4 30.6 3.1 19.9 2.2 11.7 1.5 5.5 8.2 1.4 16 1.4s14.5 4.1 13.8 10.3c-.9 8.2-10.2 18.9-13.8 18.9z"/>
            <rect x="12.4" y="4.6" width="7.2" height="11.2" rx="3.6" fill="#000"/>
            <path d="M10.25 12.6a5.75 5.75 0 0 0 11.5 0M16 18.35v4.4M13.2 23.1h5.6" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M14.2 7v6.4M16 7v6.4M17.8 7v6.4" stroke="#fff" stroke-width=".8" stroke-linecap="round"/>
          </mask>
        </defs>
        <rect width="32" height="32" fill="url(#fill)" mask="url(#cut)"/>
      </svg>
        <span>JBKaraoke</span>
      </a>
      <p class="code" aria-hidden="true">422</p>
      <h1>That change couldn&rsquo;t be saved</h1>
      <p class="message">The page may have been open a long time, or you were signed out in the meantime. Go back, refresh the page, and try your change again.</p>
      <div class="actions">
        <a class="button primary" href="/" onclick="if (history.length > 1) { history.back(); return false; }">Go back</a>
        <a class="button" href="/">Go to JBKaraoke</a>
      </div>
    </main>
  </body>
</html>
